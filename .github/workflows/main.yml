name: Update Pokémon GO Data

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 06:00 UTC
  workflow_dispatch:   # Allows running manually from GitHub UI

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Update Script
        run: python3 update_pogo_data.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clean_pogo_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Pokémon GO game data [skip ci]" && git push)
